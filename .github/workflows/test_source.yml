name: Test source
run-name: "Test source: ${{ github.head_ref }} (${{ github.event.action }})"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    name: RSpec
    runs-on: ubuntu-24.04
    concurrency:
      group: test-source-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec
